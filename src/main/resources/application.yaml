spring:
  application:
    name: SftpToDbApp

  datasource:
    url: jdbc:sqlserver://localhost:1433;databaseName=excel_to_db;encrypt=true;trustServerCertificate=true
    username: sa
    password: Tspl@123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true

server:
  address: 127.0.0.1
  port: 8080

# ==========================================================
# SFTP Configuration
# ==========================================================
sftp:
  host: localhost
  port: 22
  user: tester
  password: password

  known-hosts: C:/Users/shivam.trangile/.ssh/known_hosts

  remote-input-directory: /INPUT
  remote-archive-directory: /WMS_ARCHIVE
  remote-error-directory: /WMS_ERROR

  local-download-directory: C:/SFTP/LOCAL_FILE_DOWNLOAD

  file-pattern: "*.xlsx"
  poll-delay: 5000
  max-messages-per-poll: 5

# ==========================================================
# Excel Configuration
# ==========================================================
excel:
  max-file-size: 10485760

# ==========================================================
# Logging
# ==========================================================
logging:
  level:
    root: INFO
    com.trangile.sftptodb: INFO
    org.springframework.integration: DEBUG
    org.springframework.integration.sftp: DEBUG
    org.springframework.integration.file: DEBUG
    org.apache.sshd: INFO
    org.hibernate.SQL: DEBUG